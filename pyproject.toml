[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "folio"
version = "0.1.0"
description = "Folio is a local retrieval-augmented assistant for PDF, text, and Markdown documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "eniquecerrud" }]
keywords = ["rag", "documents", "retrieval", "llm", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "streamlit>=1.39",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.1"]
chroma = ["chromadb>=0.5.5"]
dev = ["pytest>=8.3", "ruff>=0.7"]
all = ["sentence-transformers>=3.1", "chromadb>=0.5.5"]

[project.scripts]
folio = "folio.cli:app"

[project.urls]
Homepage = "https://github.com/eniquecerrud/ai-document-assistant"
Repository = "https://github.com/eniquecerrud/ai-document-assistant"
Issues = "https://github.com/eniquecerrud/ai-document-assistant/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/folio"]

[tool.hatch.build.targets.sdist]
include = ["src/folio", "README.md", "LICENSE", "folio.yaml", "samples/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.per-file-ignores]
"src/folio/api.py" = ["B008"]
"src/folio/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["folio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--import-mode=importlib"]
